[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "database-gui"
version = "0.1.0"
description = "A CustomTkinter GUI for creating, viewing, updating, and deleting MongoDB databases, collections, and documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mongomock>=4.1",
    "pyinstaller>=6.0",  # builds dist/db-gui.exe, see SETUP.md
]

# Lets teammates just type `db-gui` in the terminal to launch the app
# once they've pip installed the project (see below).
[project.scripts]
db-gui = "db_gui.main:main"

# Tells setuptools the installable package lives under src/, not the repo root.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Capture output at the Python level, not by redirecting file descriptors:
# with pytest's default fd capture, Tk on Windows randomly fails to start or
# load images (bare TclError), making GUI tests fail/skip at random.
addopts = "--capture=sys"
# Same filter as gui/assets.py: our icons are tk.PhotoImage (no Pillow), which
# CustomTkinter warns about; pytest resets warning filters per test.
filterwarnings = ["ignore:.*Given image is not CTkImage:UserWarning"]

# Ship the images in src/db_gui/assets/ (brand mark, etc.) with the package.
[tool.setuptools.package-data]
db_gui = ["assets/*.png"]
